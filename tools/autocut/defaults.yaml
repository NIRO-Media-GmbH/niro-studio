# NIRO AutoCut — Standardwerte. Pro Charge überschreibbar in <Charge>/_intern/autocut/config.yaml
pause_s: 1.0                # Lücke zwischen Beats
handle_in_frames: 6         # Vorlauf vor dem ersten Wort
handle_out_frames: 8        # Nachlauf nach dem letzten Wort
align_min_score: 0.80       # Mindest-Ähnlichkeit Zitat ↔ Transkript (0–1)
duration_tolerance: [0.5, 2.0]   # Beat-Dauer relativ zur Plan-Schätzung „~x s"
target_length_warn: 0.25    # Warnung ab 25 % Abweichung von der Ziellänge
sync:
  sr: 16000
  hop_s: 0.005
  win_s: 0.02
  min_confidence: 4.0
  max_drift_frames: 1.0
  exclusion_s: 1.0
index:
  model: claude-opus-5
  effort: medium              # Opus 5 denkt adaptiv; effort ist der Kostenhebel
  max_tokens: 4000
  scene_threshold: 0.30
  frames_min: 4
  frames_max: 24
  frame_interval_s: 2.0
  tile_px: 640                # Kachelbreite (Hochkant: Kachelhöhe); nie unter 640x360 für Mängelurteile
  pad_px: 8
  grid: [4, 3]                # 4x3 à 640x360 → 2600x1112 → ~3.700 Bildtoken pro Bogen
  parallel: 4
broll:                      # Profil v2 (Feedback 04.09.2026); profile/<name>.yaml überschreibt, Chargen-config.yaml zuletzt
  face_share: [0.15, 0.20]          # Sprecher sichtbar (Fenster-Summe / Gesamtlänge): Ziel
  face_share_hard: [0.12, 0.23]     # … harte Grenze (Fehler)
  window_first_s: 2.5               # Sprecher-Fenster beim ersten Auftritt einer Person
  window_s: 2.0                     # … bei weiteren Auftritten
  window_min_s: 1.5
  window_max_s: 4.0
  full_face_beat_max_s: 3.0         # Beats kürzer als das bleiben ganz Gesicht
  full_face_keywords: ["Gehaltenes Gesicht", "Bookend"]
  shot_len_s: [2.0, 5.0]            # Shot-Länge über O-Ton (Timeline-Sekunden)
  shot_len_slow_max_s: 6.0          # … Obergrenze bei tempo 2/4
  montage_len_s: [1.5, 3.0]         # in Platzhalter-Beats (vo/bild/grafik)
  fast_cuts_len_s: [1.0, 2.0]       # Plan-Kommentar „Schnelle Cuts"
  scene_min_shots: 3                # Szene = mindestens so viele Shots aus einem Ordner
  scene_short_stretch_s: 6.0        # Strecken darunter dürfen weniger Shots haben
  setup_hash_min_distance: 10       # dHash-Abstand, darunter „sieht fast gleich aus" (Warnung)
  max_exceptions_warn: 3
  forbidden_maengel: ["Blick in Kamera", "Crew im Bild", "Logo/Marke"]
ton:                        # Stufe 5 Finalisieren: FX3-Ton je Timeline-Clip normalisieren
  ziel_dbtp: -3.0
  max_gain_db: 30.0
  clip_warn_dbtp: -0.5
  silence_dbtp: -60.0
index_sections:             # Stufe 2b: Nachlauf je Abschnitt (Frames aus dem Cache, Modell wie index.model)
  tile_px: 480
  per_section: 2
  max_sections: 5
  effort: medium
  max_tokens: 2500
  parallel: 4
path_map: {}                # Präfix in den Arbeitsdateien → Präfix, unter dem das Material jetzt liegt (z. B. NAS → SSD);
                            # je Charge in _intern/autocut/config.yaml setzen; längster Präfix gewinnt, Ordnergrenze
resolve:
  bin_root: AutoCut
  timeline_prefix: AutoCut
  start_timecode: "01:00:00:00"
  track_names:
    V1: "FX3"
    V2: "a7IV"
    V3: "B-Roll"
    A1: "FX3 Ton"
  roh_suffix: " (roh)"        # Stufe-1-Timeline; die End-Timeline ohne Suffix entsteht beim Finalisieren
kanten:                     # Kantenprüfung am Export (Spec 2026-09-16); Startwerte, Kalibrierung am Taxodia-Export steht im WORKFLOW
  schwarz_mittel_max: 24.0      # Graustufen 0–255 aus dem Export (Limited Range: Schwarz ≈ 16)
  schwarz_streuung_max: 4.0     # Standardabweichung je Frame (96×54) — Schwarzbild hat keine Struktur
  wechsel_diff_min: 18.0        # mittlere Absolutdifferenz zum Vorframe (96×54) ab der ein Bildwechsel „hart" ist
  schnipsel_max_frames: 2       # zwei harte Wechsel höchstens so weit auseinander → Schnipsel
  grafik_pfade: ["/Ergebnisse/Renders/"]   # Grafik-Items erkannt am Dateipfad (Motion-Renders), egal auf welcher Spur
  grafik_spuren: []             # zusätzlich ganze Spuren als Grafik werten (z. B. ["V5"]); Taxodia: User legte Grafik auf V5
  grafik_abstand_frames: 2      # Taxodia 16.09.: alle 16 Schnipsel lagen 0–2 Frames an Grafik-Kanten (Flash/Wipe/Iris)
  knack_ar_ordnung: 32          # AR-Vorhersage; Knackser = Spitze des Vorhersage-Rests
  knack_kante_ms: 2             # Suchfenster um das Schnitt-Sample (PCM-Export schneidet sample-genau; 10 ms fing Sprachtransienten)
  knack_fenster_ms: 100         # Fit-Fenster der AR-Koeffizienten und Umgebung für die Streuung (MAD)
  knack_min: 0.005              # Mindest-Spitze des Rests (Vollaussteuerung = 1.0) — leiser ist nicht hörbar
  knack_faktor: 12.0            # Spitze / Streuung; Taxodia: −40-dBFS-Sprung 51/51 erkannt, saubere Kanten p95 11
  tonloch_dbfs: -90.0           # RMS je Frame darunter = digitale Stille
  tonloch_min_frames: 2
  wort_toleranz_ms: 60          # Wörter bis so weit neben der Kante zählen (Scribe-Zeiten driften)
  wort_tal_db: 12               # Befund, wenn der Quellton an der Kante (beidseitig 20 ms) höchstens so weit unter der Wortspitze liegt
  wort_pegel_min_dbfs: -50      # … und darüber; Taxodia 16.09.: Schnitte im Tal lagen bei −55 dBFS, Raumton FX3 −55 … −76
replay:                     # Review in Dropbox Replay (Spec 2026-09-16; Live-Test 16.09.: Quick Export verknüpft, Marker „FrameIO")
  geprueft_am: "2026-09-16"     # Live-Test (Spec-Nachtrag); leer → autocut_replay.py lädt nicht hoch
  quickexport_preset: Replay
  video_quality_ueber_1080p: 12000   # kbit/s für Timelines über 1920 px (Quick Export lädt in Timeline-Auflösung hoch); 0 = automatisch
  dropbox_marker: {color: FrameIO}   # Merkmal der Replay-Kommentare in GetMarkers()
  frameio_marker_beim_upload: sperren   # sperren | erlauben — Timeline mit Replay-Markern (Kopie) hochladen? (Kopie-Test, Plan Task 1)
  version_weg: neubau           # neubau | kopie — Session-Arbeit: wie neue Versionen entstehen (Kopie-Test)
  ordner: ["Autocut", "{kunde}", "{projekt}"]   # Replay-Ordner; Namen wie unter projects/
  eigene_autoren: ["NIRO Productions GmbH"]     # Präfixe der Anzeigenamen (nur im Chrome sichtbar); andere → Rückfrage
  sync_warten_s: 60             # kommentare: bei 0 Kommentaren alle 30 s nachlesen, bis zu so lange
  vollbild_min: [1900, 1000]    # unbenanntes Resolve-Fenster ab dieser Größe = Vollbild-Wiedergabe (fenster.swift)
  marker_farben: {umgesetzt: Green, handarbeit: Lemon, rueckfrage: Rose}   # Session-Arbeit: Marker auf der neuen Version
telemetrie:                 # Kamera-Telemetrie je Clip (Spec 2026-09-19): Gyro/Beschleunigung/Brennweite aus der
                            # Sony-rtmd-Spur, optischer Rückfall (Phasenkorrelation) für Clips ohne Datenspur.
                            # Beide Wege: px @480 je 25-fps-Frame.
  fenster_s: 2.0            # Fensterlänge für ruhige Fenster und Bewegungsart
  schritt_s: 1.0
  tiefpass_s: 0.5           # gleitendes Mittel vor der Richtungsentscheidung
  ruhig_max_px: 0.15        # Fenster gilt als ruhig (Startwert = optische Faustregel 18.09.: ruhige Handkamera 0,05–0,15)
  stativ_max_grad_s: 0.3    # darunter Stativ/statisch (Gyro-Weg; über f_px in px je Frame umgerechnet)
  stativ_max_px: 0.02       # … optischer Weg ohne Brennweite
  schwenk_min_grad_s: 3.0   # dominante Drehung ab hier Schwenk/Tilt
                            # Beide °/s-Schwellen gelten für die sichtbare Bewegung nach px_faktor, am Gyro also
                            # Wert / px_faktor: FX3 (0,60) ≈ 0,5 °/s Stativ, 5 °/s Schwenk; a7 IV (0,69) ≈ 0,43 / 4,3 °/s
  schwenk_min_px: 1.0
  hf_grenze_hz: 3.0         # Grenze zwischen Gimbal-/Fahrt-Bewegung und Hand-Zittern
  hand_hf_anteil_min: 0.15  # Leistungsanteil ab hf_grenze_hz, ab dem „hand" statt „gimbal"; Kalibrierung 21.09.2026
                            # Hochzeitszauber: Mitte P75 FX3-Gimbal 0,107 / P25 a7-IV-Hand 0,191
  pitch_klassen_grad: [-60, -8, 8]   # Pitch: ≤ −60 Vogelperspektive, ≤ −8 Aufsicht, ≥ 8 Untersicht, sonst Augenhöhe
  achsen: {schwenk: 1, tilt: 0}                    # Gyro-Spalten (x links, y oben, z vorwärts): Schwenk um y, Tilt um x
  vorzeichen: {schwenk: 1, tilt: -1, pitch: 1}     # Kalibrierung 21.09.2026, Hochzeitszauber 301 FX3/54 a7 IV: Gyro-y ↔ dx
                                                   # r 0,65/0,58, Gyro-x ↔ dy r −0,83/−0,27 (+y: nach links, Inhalt rechts)
  px_faktor: {FX3: 0.60, a7IV: 0.69}               # IBIS-Dämpfung je Kamera (Gyro-px → optisch-px), Kalibrierung 21.09.2026,
                                                   # Hochzeitszauber 301/54 Clips, Spearman 0,76/0,71
  optisch_fuer: []          # Kameras, deren Gyro-Wert nicht belastbar ist (Rangkorrelation < 0,7) → optischer Weg
  optisch_breite: 480       # Bildbreite der Messung (Höhe 9:16-passend 270)
  parallel: 2               # Clips gleichzeitig (Lesen der ganzen Datei ≈ 300 MB/s übers NAS)
  # Zoomfahrten (Spec 2026-09-21): KB-Brennweite je Frame aus der rtmd-Spur, Tempo = Änderung von ln(KB) in % pro s
  zoom_min_proz: 3.0        # Mindeständerung der Brennweite für eine Zoomfahrt (%); Fokus-Atmen bleibt darunter
  zoom_rausch_proz_s: 1.0   # Rauschgrenze des Tempos: Frames mit |v| darüber gehören zu einer Fahrt
  zoom_schnell_proz_s: 100.0 # Spitzentempo, ab dem eine Zoomfahrt schnell ist (% pro s); Kalibrierung 21.09.2026:
                             # W&L + MEK, alle 10 Beispiele (14–55 %/s) vom User „ok", Grenze vom User „grob ab 100"
  zoom_ruck_max: 1.0        # Ungleichmäßigkeit (Variationskoeffizient von |v|), ab der eine Fahrt ruckartig = schnell ist;
                            # 21.09.: ruckartige Beispiele (0,74/0,77) waren „ok" → nur noch Extremfälle
  zoom_stocken_anteil: 0.0  # Stocken (|v| fällt mitten in der Fahrt unter diesen Anteil der Spitze): 0,0 = aus (21.09.:
                            # Fahrten mit Stocken, auch Drehteller 0085, vom User „ok")
  zoom_sprung_proz: 12.0    # Sprung: ändert sich ln(KB) in 0,12 s (3 Frames) um so viel % oder mehr, ist die Fahrt schnell;
                            # = zoom_schnell_proz_s × ZOOM_SPRUNG_S (100 %/s × 0,12 s): die Grenze des Users auf dem kurzen
                            # Fenster — fängt den stufigen Klarbild-Zoom (a7 IV), den das 0,2-s-Gleitmittel unter 100 %/s
                            # drückt; Beispiele 1–10 max. 7,2 % (55 %/s gleichmäßig = 6,6 %). Nur zusammen mit
                            # zoom_schnell_proz_s ändern.
  zoom_verlauf_hz: 5        # Auflösung von kb_verlauf (Werte je Sekunde)
  # Brennweitenfolge B-Roll (Spec 2026-09-21): nie zweimal dieselbe Brennweite direkt hintereinander, sonst digitaler Zoom
  # (nur Vorlagen 3a/6d, ändert keine Messung → nicht im Config-Hash der Telemetrie)
  brennweite_gleich_max: 0.20   # Abstand größere/kleinere KB-Brennweite − 1: darunter gilt die Brennweite als gleich
  digitalzoom_faktor: 1.25      # Zoom für den Shot mit der längeren scheinbaren Brennweite (der kürzere braucht mehr)
  digitalzoom_max: 1.5          # Obergrenze für das Produkt aller Zooms eines Shots (4K: bewusst leicht hochskaliert)
gyroflow:                   # Gyroflow-Stabilisierung für B-Roll (Spec 2026-09-22): Sidecar neben der Mediendatei,
                            # angewendet per OFX im Schnitt — kein Render, keine zweite Medienhaltung.
  cli: "/Applications/Gyroflow.app/Contents/MacOS/gyroflow"
  zeitueberschreitung_s: 300   # je Clip; Lesen der Gyrospur kostet die ganze Datei (≈ 300 MB/s übers NAS)
  # Glättung je Haltung aus telemetrie.json. Startwerte 22.09., am ersten echten Durchlauf zu prüfen.
  glaettung: {stativ: 0.2, gimbal: 0.4, hand: 0.7}
  # Gyroflows eigene Zoom-Obergrenze in Prozent (100 = kein Beschnitt) — deckelt NUR Gyroflows Beschnitt.
  # Muss die Ungleichung max_zoom ≤ digitalzoom_max / digitalzoom_faktor × 100 einhalten (1,5 / 1,25 × 100 = 120);
  # pruefe_deckel() bricht sonst ab. ACHTUNG: das ist KEINE Zusage über den Gesamtzoom. Der digitale Zoom der
  # Brennweitenregel kommt obendrauf und geht bis digitalzoom_max (1,5) — heutiger schlimmster Fall also
  # 1,2 × 1,5 = 1,8× auf einer 4K-Quelle. Gyroflows Beschnitt in die Brennweitenregel einzuspeisen ist vereinbart,
  # aber noch nicht umgesetzt (Spec 2026-09-22, Abschnitt 4).
  max_zoom: {stativ: 105, gimbal: 110, hand: 120}
